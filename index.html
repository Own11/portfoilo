<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>DIYAR OWN · kind guy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg-0: #090b10;
            --bg-1: #0e1117;
            --card-bg: rgba(14, 17, 23, 0.82);
            --card-border: rgba(255, 255, 255, 0.07);
            --text-main: #eef0f2;
            --text-muted: #6f7684;
            --text-dim: #4a505c;
            --signal: #ffffff;
            --signal-dim: rgba(255, 255, 255, 0.08);
            --signal-line: rgba(255, 255, 255, 0.28);
            --ok: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background:
                radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.05) 0%, transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(255, 255, 255, 0.035) 0%, transparent 40%),
                var(--bg-0);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.25rem;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            letter-spacing: -0.011em;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* faint scanlines across the whole viewport, echoes the "monitoring" idea without being loud */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(180deg,
                    rgba(255, 255, 255, 0.012) 0px,
                    rgba(255, 255, 255, 0.012) 1px,
                    transparent 1px,
                    transparent 3px);
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        .card {
            position: relative;
            z-index: 1;
            max-width: 560px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--card-border);
            box-shadow:
                0 40px 100px -30px rgba(0, 0, 0, 0.85),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        /* TERMINAL TITLE BAR — the signature element: this whole card reads as a
           monitoring console for one person, which is exactly what ALERTA (his app) does */
        .console-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1.25rem;
            background: rgba(255, 255, 255, 0.015);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .console-dots {
            display: flex;
            gap: 0.4rem;
        }

        .console-dots span {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
        }

        .console-path {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-dim);
            letter-spacing: 0.01em;
        }

        .console-live {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--ok);
            letter-spacing: 0.04em;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--ok);
            box-shadow: 0 0 8px rgba(56, 229, 164, 0.7);
            animation: blip 1.8s infinite ease-in-out;
        }

        @keyframes blip {

            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.85);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .content {
            padding: 2.25rem 2.25rem 1.75rem;
        }

        /* HEADER */
        .header {
            margin-bottom: 1.5rem;
        }

        .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--signal);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .eyebrow::before {
            content: '';
            width: 14px;
            height: 1px;
            background: var(--signal-line);
        }

        .name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1;
            color: var(--text-main);
        }

        .name .cursor {
            display: inline-block;
            width: 3px;
            height: 2.1rem;
            background: var(--signal);
            margin-left: 0.35rem;
            vertical-align: -0.15em;
            animation: caret 1.05s step-end infinite;
        }

        @keyframes caret {

            0%,
            49% {
                opacity: 1;
            }

            50%,
            100% {
                opacity: 0;
            }
        }

        .sub-head {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-top: 0.55rem;
        }

        .sub-head span {
            color: var(--text-dim);
        }

        /* STATUS */
        .status {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.6rem;
            background: var(--signal-dim);
            padding: 0.4rem 0.85rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: #d7dade;
            border: 1px solid var(--signal-line);
        }

        .status .sep {
            color: rgba(255, 106, 57, 0.35);
        }

        .status .highlight {
            font-weight: 500;
            color: var(--text-main);
        }

        /* EXPERIENCE — framed as a log, since that matches the console concept */
        .experience {
            display: flex;
            flex-direction: column;
            margin-bottom: 2rem;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
        }

        .exp-item-link {
            text-decoration: none;
            color: inherit;
        }

        .exp-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.85rem 0 0.85rem 1.25rem;
            transition: padding-left 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .exp-item::before {
            content: '';
            position: absolute;
            left: -1px;
            top: 50%;
            transform: translateY(-50%);
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-dim);
            border: 2px solid var(--bg-1);
            outline: 2px solid rgba(255, 255, 255, 0.08);
        }

        .exp-item.is-active::before {
            background: var(--signal);
            outline-color: var(--signal-line);
        }

        .exp-item-link:hover .exp-item {
            padding-left: 1.55rem;
        }

        .exp-left {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .exp-role {
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .exp-company {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .exp-arrow {
            font-family: 'JetBrains Mono', monospace;
            color: var(--signal);
            font-size: 0.85rem;
            opacity: 0;
            transform: translateX(-4px);
            transition: all 0.25s ease;
            flex-shrink: 0;
        }

        .exp-item-link:hover .exp-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        /* LINKS */
        .links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.65rem;
            margin-bottom: 1.75rem;
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.025);
            padding: 0.75rem 0.5rem;
            border-radius: 12px;
            text-decoration: none;
            color: #c3c8d1;
            font-weight: 500;
            font-size: 0.82rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .link-btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
            opacity: 0.75;
            transition: transform 0.22s ease, opacity 0.22s ease;
        }

        .link-btn:hover {
            background: var(--signal-dim);
            border-color: var(--signal-line);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .link-btn:hover svg {
            opacity: 1;
            transform: scale(1.08);
        }

        /* FOOTER */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .footer .uptime {
            color: var(--text-muted);
        }

        @media (prefers-reduced-motion: reduce) {

            .live-dot,
            .name .cursor {
                animation: none;
            }
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .content {
                padding: 1.75rem 1.5rem 1.5rem;
            }

            .name {
                font-size: 2.3rem;
            }

            .name .cursor {
                height: 1.7rem;
            }

            .links {
                grid-template-columns: 1fr;
            }

            .link-btn {
                padding: 0.85rem 1rem;
                font-size: 0.9rem;
            }

            .exp-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.3rem;
            }

            .footer {
                flex-direction: column;
                gap: 0.5rem;
                align-items: flex-start;
            }
        }

        @media (max-width: 380px) {
            .name {
                font-size: 1.9rem;
            }

            .console-path {
                display: none;
            }
        }
    </style>
</head>

<body>
