<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>DIYAR OWN · kind guy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg-color: #080706;
            --card-bg: rgba(18, 15, 13, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3eee9;
            --text-muted: #8e8379;
            --accent-white: #ffffff;
            --accent-glow: rgba(255, 255, 255, 0.08);
            --btn-bg: rgba(255, 255, 255, 0.03);
            --btn-hover: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            letter-spacing: -0.011em;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        /* МЯГКОЕ ДИНАМИЧЕСКОЕ СВЕЧЕНИЕ НА ФОНЕ */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.04) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            filter: blur(50px);
        }

        /* ГЛАВНАЯ КАРТОЧКА */
        .card {
            position: relative;
            z-index: 1;
            max-width: 580px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 3rem;
            border-radius: 32px;
            border: 1px solid var(--card-border);
            box-shadow:
                0 30px 100px -20px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow:
                0 35px 110px -20px rgba(0, 0, 0, 0.95),
                0 0 40px rgba(255, 255, 255, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* ВЕРХНИЙ СВЕТОВОЙ АКЦЕНТ */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        }

        /* ХЕДЕР */
        .header {
            margin-bottom: 1.75rem;
        }

        .name {
            font-size: 3.25rem;
            font-weight: 600;
            letter-spacing: -0.04em;
            line-height: 1.05;
            margin-bottom: 0.5rem;
            background: linear-gradient(180deg, #ffffff 30%, #a8a099 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-head {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.02em;
            text-transform: lower-case;
        }

        /* СТАТУС / ИНФО-БАР */
        .status {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.025);
            padding: 0.45rem 0.9rem;
            border-radius: 100px;
            margin-bottom: 2.25rem;
            font-size: 0.85rem;
            color: #a3988e;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status .sep {
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.75rem;
        }

        .status .highlight {
            font-weight: 500;
            color: var(--text-main);
        }

        .status-link {
            color: var(--accent-white);
            text-decoration: none;
            transition: opacity 0.2s;
            font-weight: 500;
        }

        .status-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .status .badge {
            background: var(--accent-glow);
            padding: 0.15rem 0.55rem;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--accent-white);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* СЕКЦИЯ ОПЫТА */
        .experience {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 2.25rem;
        }

        .exp-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.2rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .exp-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateX(4px);
        }

        /* Убираем подчеркивание у ссылки */
        .exp-item-link {
            display: contents;
            text-decoration: none;
            color: inherit;
        }

        .exp-item-link .exp-item {
            cursor: pointer;
        }

        .exp-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .exp-role {
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .exp-company {
            font-weight: 400;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .exp-tag {
            background: rgba(255, 255, 255, 0.04);
            padding: 0.35rem 0.8rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #b5a89e;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .exp-item .exp-link-icon {
            color: var(--accent-white);
            font-size: 0.8rem;
            opacity: 0.3;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .exp-item:hover .exp-link-icon {
            opacity: 0.9;
            transform: translateX(3px);
        }

        /* КНОПКИ ССЫЛОК */
        .links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            background: var(--btn-bg);
            padding: 0.75rem 1rem;
            border-radius: 100px;
            text-decoration: none;
            color: #c9bfb5;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .link-btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
            opacity: 0.7;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .link-btn:hover {
            background: var(--btn-hover);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .link-btn:hover svg {
            opacity: 1;
            transform: scale(1.1);
        }

        /* ФУТЕР */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.75rem;
            color: #61554c;
        }

        .footer .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.3rem 0.8rem;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-white);
            font-weight: 500;
            font-size: 0.7rem;
        }

        .footer .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-white);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(0.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        /* АДАПТИВНОСТЬ ДЛЯ ТЕЛЕФОНОВ */
        @media (max-width: 600px) {
            .card {
                padding: 2rem 1.5rem 1.5rem;
                border-radius: 28px;
                max-width: 100%;
                margin: 0.5rem;
            }

            .name {
                font-size: 2.5rem;
            }

            .sub-head {
                font-size: 0.9rem;
            }

            .status {
                font-size: 0.75rem;
                padding: 0.35rem 0.7rem;
                gap: 0.4rem;
                margin-bottom: 1.75rem;
            }

            .links {
                grid-template-columns: 1fr;
                gap: 0.6rem;
            }

            .link-btn {
                padding: 0.85rem 1rem;
                font-size: 0.95rem;
                justify-content: center;
            }

            .link-btn svg {
                width: 18px;
                height: 18px;
            }

            .exp-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
                padding: 0.9rem 1rem;
            }

            .exp-role {
                font-size: 0.9rem;
            }

            .exp-company {
                font-size: 0.85rem;
            }

            .exp-tag {
                align-self: flex-start;
                font-size: 0.7rem;
            }

            .footer {
                flex-direction: column-reverse;
                align-items: center;
                gap: 0.8rem;
                padding-top: 1.2rem;
            }

            .footer .status-indicator {
                font-size: 0.65rem;
                padding: 0.25rem 0.7rem;
            }
        }

        /* Для очень маленьких экранов */
        @media (max-width: 380px) {
            .card {
                padding: 1.5rem 1rem 1.2rem;
                border-radius: 24px;
            }

            .name {
                font-size: 2rem;
            }

            .status {
                font-size: 0.65rem;
                padding: 0.3rem 0.6rem;
            }

            .exp-item {
                padding: 0.7rem 0.8rem;
                border-radius: 16px;
            }

            .exp-left {
                flex-wrap: wrap;
                gap: 0.3rem;
            }

            .link-btn {
                font-size: 0.85rem;
                padding: 0.7rem 0.8rem;
            }
        }
    </style>
</head>
